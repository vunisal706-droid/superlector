<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#38bdf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SuperLector">
<meta name="description" content="Juego de lectura con Capitulín para Infantil 5 años">
<title>Capitulín SuperLector</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0ea5e9; --primary-d:#0369a1; --primary-l:#e0f2fe;
  --ok:#16a34a; --ok-d:#15803d; --ok-l:#dcfce7;
  --warn:#f59e0b; --warn-d:#b45309;
  --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
  --font-display:'Fredoka','Nunito',system-ui,sans-serif;
  --font-word:'Andika','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--text);background:#e0f2fe;
  -webkit-user-select:none;user-select:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
button:focus-visible{outline:4px solid var(--primary);outline-offset:3px}
[hidden]{display:none!important}

#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}

/* ---------- Botones clay ---------- */
.clay{border-radius:22px;background:#fff;box-shadow:0 6px 0 #cbd5e1,0 10px 18px rgba(15,23,42,.10);
  transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--font-display);font-weight:600;font-size:22px;min-height:64px;padding:0 22px}
.clay:active{transform:translateY(5px);box-shadow:0 1px 0 #cbd5e1}
.clay svg{width:34px;height:34px;flex:none}
.clay.green{background:var(--ok);color:#fff;box-shadow:0 6px 0 var(--ok-d),0 10px 18px rgba(21,128,61,.25)}
.clay.green:active{box-shadow:0 1px 0 var(--ok-d)}
.clay.amber{background:#fbbf24;color:#422006;box-shadow:0 6px 0 #d97706,0 10px 18px rgba(217,119,6,.25)}
.clay.amber:active{box-shadow:0 1px 0 #d97706}
.clay.blue{background:var(--primary);color:#fff;box-shadow:0 6px 0 var(--primary-d),0 10px 18px rgba(3,105,161,.25)}
.clay.blue:active{box-shadow:0 1px 0 var(--primary-d)}
.clay.round{width:76px;height:76px;padding:0;border-radius:24px}
.clay.round svg{width:44px;height:44px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 16px 6px 8px;
  font-family:var(--font-display);font-weight:700;font-size:26px;box-shadow:0 4px 12px rgba(15,23,42,.10);min-height:52px}
.pill svg{width:38px;height:38px}

/* ---------- Pantallas DOM ---------- */
.screen{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#bae6fd 0%,#e0f2fe 45%,#fef9c3 100%);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.screen .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh;z-index:-1;pointer-events:none}
.topbar{display:flex;align-items:center;gap:14px;min-height:80px;flex:none}
.title{flex:1;font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5.4vmin,56px);color:var(--primary-d);line-height:1;display:flex;align-items:center;gap:12px}
.title span{color:#ef4444}
.title svg{width:clamp(44px,7vmin,70px);height:auto}

/* Menú */
.menuMain{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,56px);min-height:0}
.capiCol{display:flex;flex-direction:column;align-items:center;gap:10px}
.capiCv{width:clamp(130px,26vmin,260px);height:auto;aspect-ratio:120/170}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 18px;font-family:var(--font-display);font-weight:600;
  font-size:clamp(20px,3vmin,28px);text-align:center;box-shadow:0 6px 16px rgba(15,23,42,.10);max-width:300px}
.bubble::before{content:"";position:absolute;left:50%;top:-13px;transform:translateX(-50%);border:12px solid transparent;border-top:0;border-bottom:14px solid #fff}
.levels{display:grid;grid-template-columns:repeat(3,clamp(110px,18vmin,180px));gap:clamp(10px,2.2vmin,22px)}
.lvl{position:relative;aspect-ratio:1;border-radius:28px;background:#fff;border:5px solid #fff;
  box-shadow:0 8px 0 #cbd5e1,0 12px 20px rgba(15,23,42,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .08s,box-shadow .08s}
.lvl:active{transform:translateY(6px);box-shadow:0 2px 0 #cbd5e1}
.lvl .let{font-family:var(--font-word);font-weight:700;font-size:clamp(40px,8vmin,84px);line-height:1;color:var(--lc)}
.lvl .let.small{font-size:clamp(26px,5vmin,52px)}
.lvl .n{font-family:var(--font-display);font-weight:600;font-size:clamp(14px,2.2vmin,20px);color:var(--muted)}
.lvl .stars{display:flex;gap:2px}
.lvl .stars svg{width:clamp(18px,3vmin,28px);height:auto}
.lvl.locked{background:#f1f5f9;box-shadow:0 8px 0 #e2e8f0;cursor:not-allowed}
.lvl.locked .let{color:#cbd5e1}
.lvl .lock{position:absolute;right:-10px;top:-10px;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(15,23,42,.12)}
.lvl .lock svg{width:30px;height:auto}
.menuSide{display:flex;flex-direction:column;gap:16px;align-items:stretch}
.teacher{font-size:17px;min-height:52px;color:var(--muted)}
.teacher[aria-pressed="true"]{color:var(--primary-d);background:var(--primary-l)}

/* Tienda */
.shopGrid{flex:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(10px,2vmin,22px);align-content:center;
  max-width:1100px;width:100%;margin:0 auto;min-height:0}
.item{background:#fff;border-radius:26px;padding:10px 10px 14px;box-shadow:0 6px 16px rgba(15,23,42,.08);border:4px solid #fff;
  display:flex;flex-direction:column;align-items:center;gap:6px}
.item.on{border-color:var(--ok);background:var(--ok-l)}
.item .capiCv{width:auto;height:clamp(70px,15vmin,150px)}
.item .nm{font-family:var(--font-display);font-weight:700;font-size:clamp(17px,2.6vmin,24px)}
.item .clay{min-height:52px;font-size:19px;padding:0 14px}
.item .clay svg{width:26px;height:26px}
.item .clay[disabled]{opacity:.45;cursor:not-allowed}
.shieldIco{width:auto;height:clamp(70px,15vmin,150px)}

/* Juego: HUD y mando */
#hud{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;gap:10px;
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));pointer-events:none}
#hud > *{pointer-events:auto}
#hud .clay.round{width:64px;height:64px}
#hud .clay.round svg{width:38px;height:38px}
.words{flex:1;display:flex;justify-content:center;gap:clamp(2px,.6vw,8px)}
.words svg{width:clamp(22px,3.8vmin,38px);height:auto}
#pad{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding:0 max(18px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
#pad > div{display:flex;gap:18px;pointer-events:auto}
.padBtn{width:clamp(84px,14vmin,120px);height:clamp(84px,14vmin,120px);border-radius:50%;background:rgba(255,255,255,.72);
  border:4px solid #fff;box-shadow:0 6px 0 rgba(148,163,184,.8),0 10px 18px rgba(15,23,42,.12);display:grid;place-items:center;touch-action:none;pointer-events:auto}
.padBtn svg{width:52%;height:auto}
.padBtn.down{transform:translateY(5px);box-shadow:0 1px 0 rgba(148,163,184,.8);background:#fff}
.padBtn.jump{width:clamp(100px,17vmin,140px);height:clamp(100px,17vmin,140px);background:rgba(220,252,231,.85)}
#toast{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:4;background:#fff;border-radius:22px;padding:12px 22px;
  font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3vmin,28px);box-shadow:0 8px 20px rgba(15,23,42,.15);border:3px solid #fde68a}

/* Diálogo de lectura */
.modal{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(224,242,254,.55);padding:16px;animation:fade .2s ease}
.card{background:#fff;border-radius:36px;box-shadow:0 20px 50px rgba(15,23,42,.20);border:5px solid #fff;
  padding:clamp(16px,3vmin,30px) clamp(18px,4vmin,40px);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2vmin,18px);
  max-width:min(900px,96vw);animation:popIn .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.word{font-family:var(--font-word);font-weight:700;font-size:clamp(84px,20vmin,200px);line-height:1.05;color:var(--text);letter-spacing:.02em;
  padding:6px 24px;border-radius:24px;background:#fffbeb;border:4px dashed #fde68a;white-space:nowrap}
.word .s0{color:#dc2626}.word .s1{color:#2563eb}
.word .dot{color:#cbd5e1;font-size:.5em;vertical-align:middle;padding:0 .08em}
.tools{display:flex;gap:12px}
.tools .clay{min-height:54px;font-size:19px}
.adult{font-size:clamp(15px,2.2vmin,19px);color:var(--muted);font-weight:700}
.answers{display:flex;gap:clamp(10px,2vw,20px);flex-wrap:wrap;justify-content:center}
.answers .clay{min-height:76px;font-size:clamp(20px,3vmin,26px);padding:0 24px}

/* Victoria / derrota */
.endCard .capiCv{width:clamp(110px,22vmin,200px)}
.endTitle{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,5.5vmin,52px);color:var(--primary-d);text-align:center}
.bigStars{display:flex;gap:10px}
.bigStars svg{width:clamp(54px,10vmin,90px);height:auto;opacity:0;transform:scale(.2)}
.bigStars svg.in{animation:starIn .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes starIn{to{opacity:1;transform:scale(1)}}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}

#rotate{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(160deg,#e0f2fe,#fef9c3);font-family:var(--font-display);font-weight:600;font-size:26px;text-align:center;padding:24px}
#rotate svg{width:120px;height:120px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}

@media (max-height:540px){
  .topbar{min-height:66px}
  .clay.round{width:62px;height:62px}
  .levels{grid-template-columns:repeat(3,clamp(90px,24vh,140px))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<canvas id="cv"></canvas>

<!-- HUD de juego -->
<div id="hud" hidden>
  <button class="clay round" id="hudHome" aria-label="Volver al menú"></button>
  <div class="pill" id="hudCoins"></div>
  <div class="pill" id="hudLives"></div>
  <div class="words" id="hudWords" aria-label="Palabras leídas"></div>
  <div class="pill" id="hudLevel"></div>
</div>
<div id="pad" hidden>
  <div>
    <button class="padBtn" id="bL" aria-label="Izquierda"></button>
    <button class="padBtn" id="bR" aria-label="Derecha"></button>
  </div>
  <div><button class="padBtn jump" id="bJ" aria-label="Saltar"></button></div>
</div>
<div id="toast" hidden></div>

<!-- Menú -->
<section class="screen" id="sMenu">
  <div class="topbar">
    <div class="title" id="logo"><b style="font-weight:700">Super<span>Lector</span></b></div>
    <div class="pill" id="menuCoins"></div>
  </div>
  <div class="menuMain">
    <div class="capiCol">
      <canvas class="capiCv" id="menuCapi" width="240" height="340"></canvas>
      <div class="bubble">¿Qué leemos hoy?</div>
    </div>
    <div class="levels" id="levels"></div>
    <div class="menuSide">
      <button class="clay amber" id="btnShop"></button>
      <button class="clay teacher" id="btnTeacher" aria-pressed="false"></button>
    </div>
  </div>
</section>

<!-- Tienda -->
<section class="screen" id="sShop" hidden>
  <div class="topbar">
    <button class="clay round" id="shopBack" aria-label="Volver"></button>
    <div class="title">Tienda</div>
    <div class="pill" id="shopCoins"></div>
  </div>
  <div class="shopGrid" id="shopGrid"></div>
</section>

<!-- Lectura -->
<div class="modal" id="dlg" hidden>
  <div class="card" id="dlgCard">
    <div class="word" id="dlgWord"></div>
    <div class="tools">
      <button class="clay" id="btnSyl"></button>
      <button class="clay" id="btnHear"></button>
    </div>
    <div class="adult">Maestro/a: ¿la ha leído bien?</div>
    <div class="answers">
      <button class="clay green" id="aOk"></button>
      <button class="clay amber" id="aAgain"></button>
      <button class="clay" id="aSkip"></button>
    </div>
  </div>
</div>

<!-- Fin de nivel -->
<div class="modal" id="win" hidden>
  <div class="card endCard">
    <canvas class="capiCv" id="winCapi" width="240" height="340"></canvas>
    <div class="endTitle">¡Nivel completado!</div>
    <div class="bigStars" id="winStars"></div>
    <div class="pill" id="winCoins"></div>
    <div class="row">
      <button class="clay green" id="winNext"></button>
      <button class="clay amber" id="winShop"></button>
      <button class="clay round" id="winHome" aria-label="Menú"></button>
    </div>
  </div>
</div>
<div class="modal" id="lose" hidden>
  <div class="card endCard">
    <canvas class="capiCv" id="loseCapi" width="240" height="340"></canvas>
    <div class="endTitle">¡Uy! Vamos a intentarlo otra vez</div>
    <div class="row">
      <button class="clay green" id="loseRetry"></button>
      <button class="clay round" id="loseHome" aria-label="Menú"></button>
    </div>
  </div>
</div>

<div id="rotate">
  <svg viewBox="0 0 100 100" aria-hidden="true"><rect x="30" y="10" width="40" height="80" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="5"/><circle cx="50" cy="80" r="4" fill="#0ea5e9"/></svg>
  Gira la tableta para jugar
</div>

<script>
'use strict';
/* =========================================================
   ICONOS (SVG: se ven igual en todos los equipos)
   ========================================================= */
const I = {
  coin:`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="#facc15" stroke="#ca8a04" stroke-width="3"/><circle cx="20" cy="20" r="10" fill="none" stroke="#fde68a" stroke-width="3"/><path d="M20 13 V27" stroke="#ca8a04" stroke-width="3" stroke-linecap="round"/></svg>`,
  heart:(on=true)=>`<svg viewBox="0 0 40 40"><path d="M20 35 C8 26 3 19 3 12.5 C3 7 7.5 3.5 12 3.5 C15.5 3.5 18.5 5.5 20 8.5 C21.5 5.5 24.5 3.5 28 3.5 C32.5 3.5 37 7 37 12.5 C37 19 32 26 20 35Z" fill="${on?'#ef4444':'#e2e8f0'}" stroke="${on?'#b91c1c':'#cbd5e1'}" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
  star:(on=true)=>`<svg viewBox="0 0 48 48"><path d="M24 4 L29.6 17.2 L44 18.4 L33 27.8 L36.4 42 L24 34.4 L11.6 42 L15 27.8 L4 18.4 L18.4 17.2Z" fill="${on?'#facc15':'#e2e8f0'}" stroke="${on?'#eab308':'#cbd5e1'}" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
  book:`<svg viewBox="0 0 48 48"><path d="M6 10 Q15 6 24 11 Q33 6 42 10 V38 Q33 34 24 39 Q15 34 6 38Z" fill="#fff" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/><path d="M24 11 V39" stroke="#94a3b8" stroke-width="3"/></svg>`,
  check:`<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19" fill="#e2e8f0"/><path d="M15 24 L22 31 L34 17" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  home:`<svg viewBox="0 0 48 48"><path d="M8 22 L24 8 L40 22" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 21 V40 H36 V21" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="4" stroke-linejoin="round"/><rect x="20" y="28" width="8" height="12" rx="2" fill="#0ea5e9"/></svg>`,
  back:`<svg viewBox="0 0 48 48"><path d="M30 10 L16 24 L30 38" fill="none" stroke="#64748b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  shop:`<svg viewBox="0 0 48 48"><path d="M8 18 H40 L37 40 H11Z" fill="#fff" stroke="#422006" stroke-width="3" stroke-linejoin="round"/><path d="M16 18 Q16 7 24 7 Q32 7 32 18" fill="none" stroke="#422006" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  lock:`<svg viewBox="0 0 48 48"><rect x="10" y="21" width="28" height="22" rx="5" fill="#cbd5e1"/><path d="M16 21 V15 Q16 7 24 7 Q32 7 32 15 V21" fill="none" stroke="#cbd5e1" stroke-width="5"/><circle cx="24" cy="31" r="3.5" fill="#fff"/></svg>`,
  unlock:`<svg viewBox="0 0 48 48"><rect x="10" y="21" width="28" height="22" rx="5" fill="currentColor" opacity=".8"/><path d="M16 21 V15 Q16 7 24 7 Q31 7 32 13" fill="none" stroke="currentColor" stroke-width="5" opacity=".8"/></svg>`,
  ear:`<svg viewBox="0 0 48 48"><path d="M8 19 H16 L26 10 V38 L16 29 H8Z" fill="#f59e0b" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 17 Q37 24 32 31 M36 12 Q45 24 36 36" fill="none" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  syl:`<svg viewBox="0 0 48 48"><rect x="4" y="14" width="18" height="20" rx="5" fill="#dc2626"/><rect x="26" y="14" width="18" height="20" rx="5" fill="#2563eb"/></svg>`,
  ok:`<svg viewBox="0 0 48 48"><path d="M10 25 L20 35 L38 13" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  again:`<svg viewBox="0 0 48 48"><path d="M36 18 A14 14 0 1 0 38 28" fill="none" stroke="#422006" stroke-width="5" stroke-linecap="round"/><path d="M38 8 V19 H27" fill="none" stroke="#422006" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  next:(c='#fff')=>`<svg viewBox="0 0 48 48"><path d="M12 24 H34 M24 13 L35 24 L24 35" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  left:`<svg viewBox="0 0 48 48"><path d="M30 8 L14 24 L30 40" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  right:`<svg viewBox="0 0 48 48"><path d="M18 8 L34 24 L18 40" fill="none" stroke="#334155" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  jump:`<svg viewBox="0 0 48 48"><path d="M8 32 L24 14 L40 32" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  shield:`<svg viewBox="0 0 100 100"><path d="M50 8 L86 20 V48 C86 70 70 84 50 92 C30 84 14 70 14 48 V20Z" fill="#38bdf8" stroke="#0369a1" stroke-width="5" stroke-linejoin="round"/><path d="M50 22 L74 30 V48 C74 63 64 72 50 78Z" fill="#bae6fd"/><path d="M50 36 L54 46 L64 46 L56 52 L59 62 L50 56 L41 62 L44 52 L36 46 L46 46Z" fill="#facc15"/></svg>`,

/* ---------- Partida ---------- */
function startLevel(n){
  const L = LEVELS[n-1];
  const words = shuffle(L.words);
  const signs = PLATFORMS.slice(0, 10).map((p, i) => i % 2 === 0
    ? {x:p.x - 70, y:GROUND - 78, word:words[i], st:'new'}
    : {x:p.x + p.w/2, y:p.y - 78, word:words[i], st:'new'});
  const ghostXs = [760, 1690, 2620, 1230, 2160].slice(0, 2 + Math.floor((n-1)/3));
  G = {
    level:n, theme:THEMES[(n-1) % THEMES.length], signs, read:0, good:0, coinsStart:S.d.coins,
    lives:3, shield:false, t:0,
    p:{x:90, y:GROUND, vx:0, vy:0, ground:true, coyote:0, face:1, walk:0, inv:0, hurtT:0},
    ghosts:ghostXs.map(x => ({trigger:x - 260, x, y:-60, on:false, alive:true, ph:Math.random()*6})),
    dino:{x:3480, dir:-1, dizzy:0},
    parts:[], cam:0, toastT:0,
  };
  if (S.d.shields > 0) { S.d.shields--; G.shield = true; S.save(); }
  hideAll(); $('#hud').hidden = false; $('#pad').hidden = false;
  state = 'play'; input.jumpBuf = 0;
  buildHUD(); render();
  say(L.focus.length > 1 ? 'Nivel de vocales. ¡A leer!' : `Nivel ${n}. ¡A leer!`);
}
function buildHUD(){
  $('#hudCoins').innerHTML = I.coin + `<span>${S.d.coins}</span>`;
  $('#hudLives').innerHTML = [0,1,2].map(i => I.heart(i < G.lives)).join('') + (G.shield ? I.shield.replace('viewBox','width="38" height="38" viewBox') : '');
  $('#hudWords').innerHTML = G.signs.map(s => s.st === 'good' ? I.star(true) : s.st === 'skip' ? I.check : I.book).join('');
  const L = LEVELS[G.level-1];

}
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; G.toastT = 150; }

function burst(x, y, colors, n=16, sp=4){
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, v = sp*(.5+Math.random());
    G.parts.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 2, life:40 + Math.random()*20, c:colors[i % colors.length], r:3 + Math.random()*3}); }
}

/* ---------- Actualización (paso fijo de 1/60 s) ---------- */
function update(){
  const g = G, p = g.p; g.t++;
  // Movimiento
  const L = input.l || input.kl, R = input.r || input.kr;
  p.vx = L && !R ? -SPEED : R && !L ? SPEED : 0;
  if (p.vx) p.face = Math.sign(p.vx);
  if (input.jumpBuf > 0) input.jumpBuf--;
  if (p.ground) p.coyote = 7; else if (p.coyote > 0) p.coyote--;
  if (input.jumpBuf > 0 && p.coyote > 0) { p.vy = -JUMP; p.ground = false; p.coyote = 0; input.jumpBuf = 0; sfx.jump(); }
  const prevY = p.y;
  p.vy = Math.min(p.vy + GRAV, 16);
  p.x = clamp(p.x + p.vx, 24, WORLD - 24);
  p.y += p.vy;
  p.ground = false;
  if (p.y >= GROUND) { p.y = GROUND; p.vy = 0; p.ground = true; }
  for (const pl of PLATFORMS) {
    if (p.vy >= 0 && prevY <= pl.y + 1 && p.y >= pl.y && p.x > pl.x - 12 && p.x < pl.x + pl.w + 12) { p.y = pl.y; p.vy = 0; p.ground = true; }
  }
  p.walk = p.vx && p.ground ? p.walk + 0.28 : p.walk * 0.8;
  if (p.inv > 0) p.inv--;
  if (p.hurtT > 0) p.hurtT--;
  // Cámara suave
  const target = clamp(p.x - V.viewW * 0.38, 0, WORLD - V.viewW);
  g.cam += (target - g.cam) * 0.12;
  // Palabras
  for (const s of g.signs) {
    if (s.st !== 'new') continue;
    const dx = p.x - s.x, dy = (p.y - 34) - s.y;
    if (dx*dx + dy*dy < 62*62) { openDialog(s); return; }
  }
  // Fantasmas
  for (const gh of g.ghosts) {
    if (!gh.alive) continue;
    if (!gh.on && p.x > gh.trigger) { gh.on = true; gh.y = -V.oy - 60; }
    if (!gh.on) continue;
    gh.ph += .05; gh.y += 1.5 + g.level * .08; gh.x += Math.sin(gh.ph) * 1.2;
    if (gh.y > GROUND - 30) { gh.alive = false; burst(gh.x, gh.y, ['#e2e8f0','#fff','#cbd5e1'], 14, 3); sfx.poof(); continue; }
    const dx = p.x - gh.x, dy = (p.y - 34) - gh.y;
    if (dx*dx + dy*dy < 44*44) {
      if (g.shield) { gh.alive = false; burst(gh.x, gh.y, ['#38bdf8','#bae6fd','#fff'], 18, 4); sfx.poof(); }
      else if (p.inv === 0) { gh.alive = false; hurt(); }
    }
  }
  // Dinosaurio
  const d = g.dino;
  if (d.dizzy > 0) d.dizzy--; else { d.x += (1.4 + g.level*.12) * d.dir; if (d.x < 3360 || d.x > 3610) d.dir *= -1; }
  if (Math.abs(p.x - d.x) < 50 && p.y > GROUND - 62) {
    if (p.vy > 0 && prevY <= GROUND - 46) { p.vy = -11; d.dizzy = 90; sfx.boing(); burst(d.x, GROUND - 60, ['#facc15','#fff'], 10, 3); }
    else if (p.inv === 0 && d.dizzy === 0) { hurt(); p.x -= 90 * Math.sign(d.x - p.x || 1); p.vy = -8; }
  }
  // Partículas
  for (const q of g.parts) { q.x += q.vx; q.y += q.vy; q.vy += .15; q.life--; }
  g.parts = g.parts.filter(q => q.life > 0);
  // Meta
  if (p.x > GOAL - 30) {
    if (g.read >= 10) { winLevel(); return; }
    if (g.toastT <= 0) { const f = 10 - g.read; toast(f === 1 ? '¡Te falta una palabra!' : `¡Te faltan ${f} palabras!`); say(f === 1 ? 'Te falta una palabra' : `Te faltan ${f} palabras`); }
    p.x = GOAL - 34;
  }
  if (g.toastT > 0 && --g.toastT === 0) $('#toast').hidden = true;
}
function hurt(){
  const g = G; g.lives--; g.p.inv = 110; g.p.hurtT = 40; sfx.hurt(); buildHUD();
  if (g.lives <= 0) { state = 'lose'; setTimeout(showLose, 500); }
}

/* ---------- Dibujo ---------- */
function render(){
  if (!G) return;
  const g = G, th = g.theme, k = V.scale * V.px;
  buildBg(th);
  ctx.setTransform(1,0,0,1,0,0);
  // Cielo
  const sky = ctx.createLinearGradient(0, 0, 0, cv.height); sky.addColorStop(0, th.sky[0]); sky.addColorStop(1, th.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, 0, V.oy * k);
  const W = V.viewW, cam = g.cam;
  // Sol
  ctx.globalAlpha = .35; circ(ctx, W - 120, 90, 70, '#fef08a'); ctx.globalAlpha = 1; circ(ctx, W - 120, 90, 38, '#fde047');
  // Nubes
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i=0;i<6;i++){
    const span = W + 400, cx = ((i*430 - cam*.15 - g.t*.15) % span + span) % span - 200, cy = 70 + (i%3)*45 - V.oy*.3;
    ctx.beginPath(); ctx.arc(cx, cy, 26, 0, 7); ctx.arc(cx+30, cy-12, 32, 0, 7); ctx.arc(cx+62, cy, 26, 0, 7); ctx.rect(cx, cy, 62, 22); ctx.fill();
  }
  // Colinas (parallax)
  const layer = (img, f) => { const off = ((cam*f) % TILE + TILE) % TILE; for (let x=-off; x<W; x+=TILE) ctx.drawImage(img, x, 0, TILE, VH); };
  layer(bgCache.far, .25); layer(bgCache.near, .5);
  ctx.save(); ctx.translate(-Math.round(cam*100)/100, 0);
  // Suelo
  const gx0 = Math.floor(cam/40)*40 - 40, gx1 = cam + W + 40;
  ctx.fillStyle = th.dirt; ctx.fillRect(gx0, GROUND, gx1-gx0, VH - GROUND + 200);
  ctx.fillStyle = th.dirtD; for (let x=gx0; x<gx1; x+=40){ circ(ctx, x+12, GROUND+30, 4, th.dirtD); circ(ctx, x+30, GROUND+48, 3, th.dirtD); }
  ctx.fillStyle = th.grass; ctx.fillRect(gx0, GROUND-2, gx1-gx0, 16);
  ctx.fillStyle = th.grassD; for (let x=gx0; x<gx1; x+=20){ ctx.beginPath(); ctx.arc(x+10, GROUND+14, 10, 0, Math.PI); ctx.fill(); }
  // Meta: arco con bandera
  drawGoal(g);
  // Plataformas
  for (const pl of PLATFORMS) {
    if (pl.x + pl.w < cam - 20 || pl.x > cam + W + 20) continue;
    rr(ctx, pl.x, pl.y, pl.w, 28, 12); ctx.fillStyle = th.dirt; ctx.fill();
    rr(ctx, pl.x - 4, pl.y - 4, pl.w + 8, 14, 7); ctx.fillStyle = th.grass; ctx.fill();
    ctx.fillStyle = th.grassD; for (let x=pl.x+6; x<pl.x+pl.w-6; x+=16){ ctx.beginPath(); ctx.arc(x+8, pl.y+10, 8, 0, Math.PI); ctx.fill(); }
  }
  // Burbujas de palabras
  for (const s of g.signs) { if (s.x > cam - 80 && s.x < cam + W + 80) drawSign(s, g.t); }
  // Dinosaurio
  drawDino(g.dino, g.t);
  // Fantasmas
  for (const gh of g.ghosts) if (gh.on && gh.alive) drawGhost(gh.x, gh.y, gh.ph);
  // Jugador
  const p = g.p;
  ctx.globalAlpha = .18; ctx.beginPath(); ctx.ellipse(p.x, groundBelow(p) + 2, 22, 5, 0, 0, Math.PI*2); ctx.fillStyle = '#0f172a'; ctx.fill(); ctx.globalAlpha = 1;
  if (!(p.inv > 0 && Math.floor(g.t/6) % 2 === 0)) {
    ctx.save(); ctx.translate(p.x, p.y + 2); ctx.scale(p.face * .5, .5); ctx.translate(-60, -162);
    drawCapi(ctx, {costume:S.d.costume, walk:p.walk, air:!p.ground, hurt:p.hurtT > 0, blink:(g.t % 200) < 7});
    ctx.restore();
  }
  if (g.shield) { ctx.beginPath(); ctx.arc(p.x, p.y - 36, 48, 0, Math.PI*2); ctx.strokeStyle = 'rgba(56,189,248,.55)'; ctx.lineWidth = 4; ctx.stroke(); ctx.fillStyle = 'rgba(186,230,253,.15)'; ctx.fill(); }
  // Partículas
  for (const q of g.parts) { ctx.globalAlpha = Math.min(1, q.life/20); circ(ctx, q.x, q.y, q.r, q.c); }
  ctx.globalAlpha = 1;
  ctx.restore();
}
function groundBelow(p){
  let y = GROUND;
  for (const pl of PLATFORMS) if (p.x > pl.x - 12 && p.x < pl.x + pl.w + 12 && pl.y >= p.y - 1 && pl.y < y) y = pl.y;
  return y;
}
function drawSign(s, t){
  const bob = Math.sin(t*.05 + s.x) * 5, x = s.x, y = s.y + bob;
  if (s.st === 'new') {
    ctx.globalAlpha = .3; circ(ctx, x, y, 40, '#fef08a'); ctx.globalAlpha = 1;

function drawGhost(x, y, ph){

  ctx.closePath(); ctx.fillStyle = '#f8fafc'; ctx.fill(); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.ellipse(-8, -6, 4, 5.5, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(8, -6, 4, 5.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, 5, 4, 5, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = .4; circ(ctx, -15, 2, 4, '#f9a8d4'); circ(ctx, 15, 2, 4, '#f9a8d4'); ctx.globalAlpha = 1;

function drawDino(d, t){

  rr(ctx, -22, -18 + step*.2, 13, 18, 5); ctx.fill(); rr(ctx, 8, -18 - step*.2, 13, 18, 5); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -36, 38, 26, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#facc15'; for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*12-6, -58 + Math.abs(i)*4); ctx.lineTo(i*12, -72 + Math.abs(i)*5); ctx.lineTo(i*12+6, -58 + Math.abs(i)*4); ctx.fill(); }
  ctx.fillStyle = '#16a34a'; rr(ctx, 22, -84, 36, 30, 14); ctx.fill(); rr(ctx, 22, -62, 12, 18, 4); ctx.fill();

/* ---------- Bucle: lógica a 60 pasos/s, igual en cualquier equipo ---------- */
const STEP = 1000/60; let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(now - last, 250); last = now;
  if (state === 'play') {
    let n = 0;
    while (acc >= STEP && n < 6 && state === 'play') { update(); acc -= STEP; n++; }
    if (n >= 6) acc = 0;
    render();
  } else acc = 0;
  requestAnimationFrame(loop);
}

const VOW = 'aeiouáéíóú';
function syllables(w){
  if (![...w].some(c => !VOW.includes(c))) return [...w];
  const out = []; let cur = '';
  for (let i=0;i<w.length;i++){
    const ch = w[i];
    if ([...cur].some(c => VOW.includes(c)) && !VOW.includes(ch) && i+1 < w.length && VOW.includes(w[i+1])) { out.push(cur); cur = ''; }
    cur += ch;
  }
  out.push(cur); return out;
}
let curSign = null, sylOn = false;

  const w = curSign.word;
  $('#dlgWord').innerHTML = sylOn
    ? syllables(w).map((s,i) => `<span class="s${i%2}">${s}</span>`).join('<span class="dot">·</span>')
    : w;
  $('#btnSyl').setAttribute('aria-pressed', String(sylOn));
}
function openDialog(s){

  if (g.read === 10) { toast('¡Todas leídas! Corre a la bandera'); say('¡Muy bien! Corre a la bandera'); }
}

/* =========================================================
   MENÚ Y TIENDA
   ========================================================= */
function hideAll(){
  ['#sMenu','#sShop','#dlg','#win','#lose','#hud','#pad','#toast'].forEach(s => $(s).hidden = true);
}
function openMenu(){
  hideAll(); state = 'menu'; releaseAll();
  $('#sMenu').hidden = false;
  $('#menuCoins').innerHTML = I.coin + `<span>${S.d.coins}</span>`;
  paintCapi($('#menuCapi'), S.d.costume);
  $('#btnTeacher').setAttribute('aria-pressed', String(!!S.d.allOpen));
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const n = i + 1, open = S.d.allOpen || n <= S.d.unlocked, st = S.d.stars[n] || 0;
    const b = document.createElement('button');
    b.className = 'lvl' + (open ? '' : ' locked'); b.style.setProperty('--lc', L.color);
    b.setAttribute('aria-label', `Nivel ${n}: ${L.label}`);
    b.innerHTML = `<span class="let${L.focus.length>1?' small':''}">${L.focus.length>1?'aeiou':L.focus}</span>
      <span class="n">Nivel ${n}</span><span class="stars">${[0,1,2].map(k => I.star(k < st)).join('')}</span>` +
      (open ? '' : `<span class="lock">${I.lock}</span>`);
    b.onclick = () => { if (!open) { sfx.click(); say('Este nivel todavía está cerrado'); return; } sfx.click(); startLevel(n); };
    box.appendChild(b);
  });
}
function openShop(){
  hideAll(); state = 'shop';
  $('#sShop').hidden = false;
  $('#shopCoins').innerHTML = I.coin + `<span>${S.d.coins}</span>`;
  const grid = $('#shopGrid'); grid.innerHTML = '';
  COSTUMES.forEach(C => {
    const own = S.d.owned.includes(C.id), on = S.d.costume === C.id;
    const el = document.createElement('div'); el.className = 'item' + (on ? ' on' : '');
    el.innerHTML = `<canvas class="capiCv" width="180" height="255"></canvas><div class="nm">${C.name}</div>`;
    const b = document.createElement('button'); b.className = 'clay' + (own ? (on ? '' : ' blue') : ' amber');
    if (on) { b.innerHTML = I.ok.replace('#fff','#16a34a') + 'Puesto'; b.disabled = true; b.style.opacity = 1; }
    else if (own) { b.textContent = 'Ponérmelo'; b.onclick = () => { S.d.costume = C.id; S.save(); sfx.click(); openShop(); }; }
    else { b.innerHTML = I.coin + C.price; b.disabled = S.d.coins < C.price;
      b.onclick = () => { if (S.d.coins < C.price) return; S.d.coins -= C.price; S.d.owned.push(C.id); S.d.costume = C.id; S.save(); sfx.coin(); openShop(); }; }
    el.appendChild(b); grid.appendChild(el);
    paintCapi(el.querySelector('canvas'), C.id);
  });
  // Escudo
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<div class="shieldIco">${I.shield.replace('viewBox','height="100%" viewBox')}</div><div class="nm">Escudo${S.d.shields ? ' ×' + S.d.shields : ''}</div>`;
  const b = document.createElement('button'); b.className = 'clay amber'; b.innerHTML = I.coin + SHIELD_PRICE;
  b.disabled = S.d.coins < SHIELD_PRICE;
  b.onclick = () => { if (S.d.coins < SHIELD_PRICE) return; S.d.coins -= SHIELD_PRICE; S.d.shields++; S.save(); sfx.coin(); openShop(); };
  el.appendChild(b); grid.appendChild(el);
}

$('#hudHome').onclick = () => { sfx.click(); openMenu(); };
$('#bL').innerHTML = I.left; $('#bR').innerHTML = I.right; $('#bJ').innerHTML = I.jump;
$('#menuCapi').addEventListener('click', () => { paintCapi($('#menuCapi'), S.d.costume, {party:true}); sfx.boing(); say('¡Hola! Soy Capitulín. ¿Qué leemos hoy?'); setTimeout(() => paintCapi($('#menuCapi'), S.d.costume), 900); });

// Pantalla completa al primer toque en tabletas
let fsTried = false;
document.addEventListener('pointerdown', e => {
  if (fsTried || e.pointerType !== 'touch') return; fsTried = true;
  const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fn && !document.fullscreenElement) { try { const p = fn.call(el); if (p && p.catch) p.catch(()=>{}); } catch (_) {} }
}, {capture:true});

resize();
openMenu();
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (state === 'menu') openMenu(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
